format = """
$time $directory
[Come on. Enough procrastinating. Let's go.](yellow)
$cmd_duration$character
"""

add_newline = false

[time]
disabled = false
format = "[$time](purple)"
time_format = "%d-%m-%Y %H:%M:%S"

[directory]
format = "[$path]()"
truncation_length = 1
truncate_to_repo = false

[cmd_duration]
min_time = 2000
format = "[$duration](yellow) "

[character]
success_symbol = "[>]()"
error_symbol = "[>]()"
